<!DOCTYPE html>
<html>
<head>
  <!-- Base href dynamic placeholder for Flutter web build -->
  <base href="/Portfolio/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Reham Alshiekh Saado - Portfolio">

  <!-- 🚫 منع التخزين المؤقت (No-Cache Headers) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Reham Saado | Portfolio</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
<script>
  // 🧹 إلغاء وتفريغ أي Service Worker أو Cache قديم في جهاز الزائر
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(registrations) {
      for (let registration of registrations) {
        registration.unregister();
      }
    });
  }
  if ('caches' in window) {
    caches.keys().then(function(names) {
      for (let name of names) {
        caches.delete(name);
      }
    });
  }
</script>

<!-- تحميل مشروع الفلاتر بعد مسح الـ Cache -->
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
